log_food:
  fields:
    person:
      selector:
        entity:
          domain: person
    name:
      required: true
      selector:
        text: {}
    kcal:
      selector:
        number:
          min: 0
          max: 5000
          step: 0.1
          mode: box
          unit_of_measurement: kcal
    protein_g:
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          mode: box
          unit_of_measurement: g
    carbs_g:
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          mode: box
          unit_of_measurement: g
    fat_g:
      selector:
        number:
          min: 0
          max: 1000
          step: 0.1
          mode: box
          unit_of_measurement: g
    fibre_g:
      selector:
        number:
          min: 0
          max: 500
          step: 0.1
          mode: box
          unit_of_measurement: g
    portions:
      default: 1
      selector:
        number:
          min: 0.05
          max: 50
          step: 0.05
          mode: box
    meal:
      selector:
        select:
          options:
          - breakfast
          - lunch
          - dinner
          - snack
    date:
      selector:
        date: {}
    source:
      default: manual
      selector:
        select:
          options:
          - photo
          - label
          - barcode
          - text
          - dish
          - manual
          - again
          - saved
          - voice
    ref:
      selector:
        text: {}
    note:
      selector:
        text: {}
    barcode:
      selector:
        text: {}
    per_100:
      selector:
        object: {}
    grams:
      selector:
        number:
          min: 0
          max: 20000
          step: 0.1
          mode: box
          unit_of_measurement: g
    unit:
      selector:
        select:
          options:
          - g
          - ml
    edited:
      selector:
        boolean: {}
    photo:
      selector:
        text: {}
    image_url:
      selector:
        text: {}
