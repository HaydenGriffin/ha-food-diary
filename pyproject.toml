[project]
name = "ha-food-diary"
version = "1.0.0"
description = "A calorie and macro diary for Home Assistant: photos, labels, barcodes, voice and meal plans."
readme = "README.md"
requires-python = ">=3.13"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP", "W", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # typographic quotes and dashes in user-facing text are intended

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true
